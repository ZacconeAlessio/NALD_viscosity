name: NALD viscosity tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m py_compile nald_viscosity/*.py scripts/*.py examples/epoxy_validation/*.py benchmarks/kobayashi_2026/*.py
      - run: python -m unittest discover -s tests -v
      - run: python benchmarks/kobayashi_2026/validate_reference.py
