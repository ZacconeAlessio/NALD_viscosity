[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nald-viscosity"
version = "0.1.0"
description = "NALD tools for shear and bulk viscosity from atomistic normal modes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alessio Zaccone"}]
dependencies = ["numpy>=1.23"]

[project.urls]
Repository = "https://github.com/ZacconeAlessio/NALD_viscosity"

[tool.setuptools.packages.find]
include = ["nald_viscosity*"]
